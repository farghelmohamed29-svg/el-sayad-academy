<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10233f">
<title>EL SAYAD ACADEMY | أكاديمية الصياد</title>
<link rel="stylesheet" href="style.css?v=20261031-homefix2">
<style>
.home-wrap{max-width:760px;margin:clamp(36px,9vh,100px) auto;padding:0 18px}
.home-card{text-align:center;background:#fff;border-radius:22px;padding:clamp(24px,5vw,44px);box-shadow:0 12px 36px #10233f12}
.home-card h1{margin:0 0 10px;color:#10233f;font-size:clamp(25px,5vw,36px)}
.home-card>p{color:#65758a;line-height:1.9;margin:0}
.home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.home-action{display:flex;min-height:150px;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px 14px;border:1px solid #dbe7ed;border-radius:16px;background:linear-gradient(145deg,#fff,#f1f8f8);color:#17243a;text-decoration:none;font:inherit}
.home-action:hover{border-color:#167c78;box-shadow:0 8px 20px #167c781c}
.home-action .symbol{font-size:34px}
.home-action strong{font-size:19px}
.home-action small{color:#65758a;line-height:1.7}
.site-menu a{display:block;padding:13px;border-radius:8px;color:#17334c;text-decoration:none;background:#f2f7fa}
@media(max-width:520px){.home-actions{grid-template-columns:1fr}.home-action{min-height:115px}}
</style>
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html"><span>EL SAYAD</span> ACADEMY</a>
<div class="header-caption">أكاديمية الصياد التعليمية</div>
<button id="menu-toggle" class="menu-toggle" aria-label="فتح القائمة" aria-expanded="false" type="button">☰</button>
<nav id="site-menu" class="site-menu" hidden><a href="admin.html">دخول الإدارة</a></nav>
</header>
<main class="home-wrap">
<section class="home-card" aria-labelledby="home-title">
<h1 id="home-title">أهلًا بك في أكاديمية الصياد</h1>
<p>اختر نوع الحساب للمتابعة.</p>
<div class="home-actions">
<a class="home-action" href="student.html"><span class="symbol" aria-hidden="true">🎓</span><strong>دخول الطالب</strong><small>تسجيل الدخول أو إنشاء حساب طالب</small></a>
<a class="home-action" href="parent.html"><span class="symbol" aria-hidden="true">👨‍👩‍👧</span><strong>دخول ولي الأمر</strong><small>متابعة نتائج الطالب وحضوره</small></a>
</div>
</section>
</main>
<footer>© EL SAYAD ACADEMY</footer>
<script>
(function(){
 const button=document.getElementById("menu-toggle");
 const menu=document.getElementById("site-menu");
 button.addEventListener("click",function(){
  const opening=menu.hidden;
  menu.hidden=!opening;
  button.setAttribute("aria-expanded",String(opening));
 });
 document.addEventListener("click",function(event){
  if(!menu.hidden&&!menu.contains(event.target)&&!button.contains(event.target)){
   menu.hidden=true;button.setAttribute("aria-expanded","false");
  }
 });
})();
</script>
</body>
</html>
